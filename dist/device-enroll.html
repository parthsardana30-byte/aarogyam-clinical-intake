<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Request device access · Arogyam</title>
  <style>
    :root { --ink:#102b27; --soft:#526b65; --teal:#0e6655; --mint:#e3f1ec; --line:#ccd9d5; --danger:#a64437; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; color:var(--ink); font-family:"Aptos","Segoe UI",system-ui,sans-serif; background:radial-gradient(circle at 50% 0,#e9f3ef 0,transparent 45%),linear-gradient(145deg,#eef2f0,#fff4c9); }
    main { width:min(540px,100%); padding:34px; border:1px solid rgba(16,43,39,.1); border-radius:30px; background:rgba(255,255,255,.95); box-shadow:0 28px 80px rgba(16,43,39,.13); }
    .brand { display:flex; align-items:center; justify-content:center; gap:11px; width:max-content; margin:0 auto 28px; border-radius:14px; color:inherit; font-size:1.25rem; font-weight:800; text-decoration:none; transition:opacity .18s ease,transform .18s ease; }
    .brand:hover { opacity:.82; transform:translateY(-1px); }
    .brand:focus-visible { outline:3px solid rgba(14,102,85,.2); outline-offset:5px; }
    .mark { width:46px; height:46px; display:grid; place-items:center; border-radius:14px; background:var(--ink); color:#78e2cb; }
    h1 { margin:0 0 9px; text-align:center; font-size:clamp(1.8rem,6vw,2.45rem); letter-spacing:-.04em; }
    .intro { margin:0 auto 26px; max-width:410px; color:var(--soft); line-height:1.55; text-align:center; }
    form { display:grid; gap:15px; }
    label { display:grid; gap:8px; color:#49635d; font-size:.82rem; font-weight:780; }
    input { min-height:54px; width:100%; padding:12px 14px; border:1px solid var(--line); border-radius:14px; background:#f8faf9; color:var(--ink); font:inherit; }
    input:focus { outline:3px solid rgba(14,102,85,.13); border-color:var(--teal); }
    button { width:100%; min-height:52px; margin-top:1px; border:0; border-radius:14px; background:var(--teal); color:#fff; font:inherit; font-weight:800; cursor:pointer; box-shadow:0 12px 28px rgba(14,102,85,.2); }
    button:disabled { opacity:.5; cursor:not-allowed; box-shadow:none; }
    .access-methods { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:2px; }
    .access-method { min-height:44px; margin:0; border:1px solid var(--line); border-radius:12px; background:#f7faf8; color:var(--soft); box-shadow:none; font-size:.8rem; }
    .access-method[aria-selected="true"] { border-color:var(--teal); background:var(--mint); color:var(--teal); box-shadow:inset 0 0 0 1px rgba(14,102,85,.08); }
    .method-panel[hidden] { display:none; }
    .scan-demo { position:relative; min-height:210px; display:grid; place-items:center; overflow:hidden; border-radius:18px; background:linear-gradient(145deg,#102b27,#17483f); }
    .scan-demo::before { content:""; position:absolute; inset:0; background:radial-gradient(circle at 50% 45%,rgba(72,216,183,.14),transparent 48%); }
    .scan-frame { position:relative; width:138px; aspect-ratio:1; border:2px solid rgba(255,255,255,.9); border-radius:18px; box-shadow:0 0 0 999px rgba(5,25,22,.22); }
    .scan-frame::before,.scan-frame::after { content:""; position:absolute; inset:-3px; border-radius:20px; border:3px solid transparent; border-top-color:#6ee7ca; border-bottom-color:#6ee7ca; }
    .scan-beam { position:absolute; left:10px; right:10px; top:50%; height:2px; background:#6ee7ca; box-shadow:0 0 14px #6ee7ca; animation:scanBeam 1.8s ease-in-out infinite alternate; }
    .scan-caption { margin:10px 0 0; color:var(--soft); font-size:.78rem; text-align:center; }
    .status { display:flex; align-items:center; justify-content:center; gap:9px; margin-top:22px; padding:14px; border-radius:14px; background:#f1f6f4; color:var(--soft); font-weight:700; text-align:center; }
    .dot { flex:0 0 auto; width:10px; height:10px; border-radius:50%; background:#dd7a2d; animation:pulse 1.15s ease-in-out infinite alternate; }
    .status.ready { color:var(--teal); background:var(--mint); }
    .status.ready .dot { background:#22a174; animation:none; }
    .status.error { color:var(--danger); background:#fff0ed; }
    .status.error .dot { background:var(--danger); animation:none; }
    .waiting-card { display:none; text-align:center; }
    .waiting-card.show { display:block; }
    .request-form.hide { display:none; }
    .device-glyph { width:72px; height:72px; display:grid; place-items:center; margin:4px auto 17px; border-radius:22px; background:var(--mint); color:var(--teal); font-size:2rem; }
    .expires { margin:12px 0 0; color:var(--soft); font-size:.82rem; text-align:center; }
    @keyframes pulse { to { opacity:.3; transform:scale(.75); } }
    @keyframes scanBeam { from { transform:translateY(-52px); } to { transform:translateY(52px); } }
    @media (prefers-reduced-motion:reduce) { .dot,.scan-beam { animation:none; } }
  </style>
</head>
<body>
  <main>
    <a class="brand" href="/#/roles" aria-label="Go to the main dashboard"><span class="mark">A</span><span>Arogyam</span></a>
    <section class="request-form" id="requestFormSection">
      <h1>Request device access</h1>
      <form id="requestForm">
        <label>Device name<input id="deviceName" required maxlength="60" autocomplete="off" placeholder="e.g. Reception tablet 2" /></label>
        <div class="access-methods" id="accessMethods" role="tablist" aria-label="Authorization method">
          <button class="access-method" id="codeMethod" type="button" role="tab" aria-selected="true">Authorization code</button>
          <button class="access-method" id="scanMethod" type="button" role="tab" aria-selected="false">Scan QR code</button>
        </div>
        <section class="method-panel" id="codePanel" role="tabpanel">
          <label id="codeField">Authorization code<input id="authorizationCode" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" placeholder="Enter the 6-digit code" /></label>
        </section>
        <section class="method-panel" id="scanPanel" role="tabpanel" hidden>
          <div class="scan-demo" aria-label="QR camera scanning preview"><div class="scan-frame"><span class="scan-beam"></span></div></div>
          <p class="scan-caption">Position the staff QR code inside the frame</p>
        </section>
        <button id="requestButton" type="submit">Request authorization</button>
      </form>
    </section>
    <section class="waiting-card" id="waitingCard">
      <div class="device-glyph">▣</div>
      <h1>Approval requested</h1>
      <p class="intro">Keep this page open. A staff member must approve <strong id="waitingName"></strong> from the staff panel.</p>
      <div class="status" id="enrollmentStatus" role="status"><span class="dot"></span><span>Waiting for staff approval…</span></div>
      <p class="expires" id="expiresText"></p>
    </section>
  </main>
  <script>
    const params = new URLSearchParams(location.search);
    let enrollmentId = params.get('enrollment') || '';
    const claimToken = params.get('token') || '';
    const requestForm = document.getElementById('requestForm');
    const requestFormSection = document.getElementById('requestFormSection');
    const requestButton = document.getElementById('requestButton');
    const codeField = document.getElementById('codeField');
    const accessMethods = document.getElementById('accessMethods');
    const codeMethod = document.getElementById('codeMethod');
    const scanMethod = document.getElementById('scanMethod');
    const codePanel = document.getElementById('codePanel');
    const scanPanel = document.getElementById('scanPanel');
    const authorizationCode = document.getElementById('authorizationCode');
    const deviceName = document.getElementById('deviceName');
    const waitingCard = document.getElementById('waitingCard');
    const waitingName = document.getElementById('waitingName');
    const enrollmentStatus = document.getElementById('enrollmentStatus');
    const expiresText = document.getElementById('expiresText');
    let requestToken = '';
    let expiresAt = 0;
    let pollTimer = 0;
    let clockTimer = 0;

    if (enrollmentId && claimToken) {
      codeField.hidden = true;
      codePanel.hidden = true;
      accessMethods.hidden = true;
    }
    authorizationCode.addEventListener('input', () => { authorizationCode.value = authorizationCode.value.replace(/\D/g, '').slice(0, 6); });

    function setAuthorizationMethod(method) {
      const scanning = method === 'scan';
      codeMethod.setAttribute('aria-selected', String(!scanning));
      scanMethod.setAttribute('aria-selected', String(scanning));
      codePanel.hidden = scanning;
      scanPanel.hidden = !scanning;
      requestButton.hidden = scanning;
    }
    codeMethod.addEventListener('click', () => setAuthorizationMethod('code'));
    scanMethod.addEventListener('click', () => setAuthorizationMethod('scan'));

    function setStatus(message, type = '') {
      enrollmentStatus.className = `status ${type}`.trim();
      enrollmentStatus.innerHTML = `<span class="dot"></span><span>${message}</span>`;
    }

    function updateCountdown() {
      const remaining = Math.max(0, expiresAt - Date.now());
      const minutes = Math.floor(remaining / 60000);
      const seconds = String(Math.floor((remaining % 60000) / 1000)).padStart(2, '0');
      expiresText.textContent = remaining ? `Invitation expires in ${minutes}:${seconds}` : 'This invitation has expired';
      if (!remaining) {
        clearInterval(clockTimer);
        clearTimeout(pollTimer);
        setStatus('Invitation expired. Ask staff to generate a new QR code.', 'error');
      }
    }

    async function pollStatus() {
      try {
        const response = await fetch(`/api/device-enrollments/${enrollmentId}/status?requestToken=${encodeURIComponent(requestToken)}`, { cache:'no-store' });
        const result = await response.json();
        if (result.status === 'authorized') {
          clearInterval(clockTimer);
          setStatus('Device authorized. Opening Arogyam…', 'ready');
          setTimeout(() => location.replace('/#/login/device-patient'), 900);
          return;
        }
        if (result.status === 'rejected') {
          clearInterval(clockTimer);
          setStatus('The authorization request was declined.', 'error');
          expiresText.textContent = 'Ask a staff member to create a new invitation if needed.';
          return;
        }
        if (result.status === 'expired') {
          expiresAt = 0;
          updateCountdown();
          return;
        }
      } catch (_) {}
      pollTimer = setTimeout(pollStatus, 1800);
    }

    requestForm.addEventListener('submit', async event => {
      event.preventDefault();
      try {
        requestButton.disabled = true;
        const name = deviceName.value.trim();
        const usingQrInvitation = Boolean(enrollmentId && claimToken);
        const code = authorizationCode.value.trim();
        if (!usingQrInvitation && !/^\d{6}$/.test(code)) {
          authorizationCode.setCustomValidity('Enter the 6-digit code shown on the staff panel.');
          authorizationCode.reportValidity();
          authorizationCode.setCustomValidity('');
          requestButton.disabled = false;
          return;
        }
        const endpoint = usingQrInvitation ? `/api/device-enrollments/${enrollmentId}/request` : '/api/device-enrollment-requests';
        const response = await fetch(endpoint, {
          method:'POST', headers:{'Content-Type':'application/json'},
          body:JSON.stringify({ name, claimToken, code, platform:navigator.userAgent })
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || 'Authorization request failed');
        waitingName.textContent = name;
        requestFormSection.classList.add('hide');
        waitingCard.classList.add('show');
        if (result.status === 'authorized') {
          expiresText.textContent = result.expiresAt
            ? `Temporary testing access expires ${new Date(result.expiresAt).toLocaleString()}.`
            : '';
          setStatus('Device authorized. Opening Arogyam…', 'ready');
          setTimeout(() => location.replace('/#/login/device-patient'), 700);
          return;
        }
        enrollmentId = result.enrollmentId || enrollmentId;
        requestToken = result.requestToken;
        expiresAt = result.expiresAt;
        updateCountdown();
        clockTimer = setInterval(updateCountdown, 1000);
        pollStatus();
      } catch (error) {
        requestButton.disabled = false;
        alert(error.message);
      }
    });
  </script>
</body>
</html>
