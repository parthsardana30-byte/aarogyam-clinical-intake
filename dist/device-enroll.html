<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Authorize this device · Arogyam</title>
  <style>
    :root { --ink:#102b27; --soft:#526b65; --teal:#0e6655; --mint:#e3f1ec; --line:#ccd9d5; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; color:var(--ink); font-family:"Aptos","Segoe UI",system-ui,sans-serif; background:radial-gradient(circle at 50% 0,#e9f3ef 0,transparent 45%),linear-gradient(145deg,#eef2f0,#fff4c9); }
    main { width:min(580px,100%); padding:30px; border:1px solid rgba(16,43,39,.1); border-radius:30px; background:rgba(255,255,255,.94); box-shadow:0 28px 80px rgba(16,43,39,.13); text-align:center; }
    .brand { display:flex; align-items:center; justify-content:center; gap:11px; margin-bottom:25px; font-size:1.25rem; font-weight:800; }
    .mark { width:46px; height:46px; display:grid; place-items:center; border-radius:14px; background:var(--ink); color:#78e2cb; }
    h1 { margin:0 0 8px; font-size:clamp(1.8rem,6vw,2.55rem); letter-spacing:-.04em; }
    .intro { margin:0 auto 22px; max-width:430px; color:var(--soft); line-height:1.55; }
    .qr-shell { width:min(310px,86vw); aspect-ratio:1; display:grid; place-items:center; margin:0 auto 19px; padding:18px; border:1px solid var(--line); border-radius:24px; background:#fff; }
    .qr-shell img { width:100%; height:100%; display:block; }
    .code-label { color:var(--soft); font-size:.78rem; font-weight:750; text-transform:uppercase; letter-spacing:.12em; }
    .code { margin:7px 0 9px; font-size:clamp(2.2rem,10vw,3.7rem); font-weight:850; letter-spacing:.16em; font-variant-numeric:tabular-nums; }
    .expires { margin:0; color:var(--soft); font-size:.86rem; }
    .status { display:flex; align-items:center; justify-content:center; gap:9px; margin-top:22px; padding:13px; border-radius:14px; background:#f1f6f4; color:var(--soft); font-weight:700; }
    .dot { width:10px; height:10px; border-radius:50%; background:#dd7a2d; animation:pulse 1.15s ease-in-out infinite alternate; }
    .status.ready { color:var(--teal); background:var(--mint); }
    .status.ready .dot { background:#22a174; animation:none; }
    .error { color:#9e3b30; background:#fff0ed; }
    @keyframes pulse { to { opacity:.3; transform:scale(.75); } }
  </style>
</head>
<body>
  <main>
    <div class="brand"><span class="mark">A</span><span>Arogyam</span></div>
    <h1>Authorize this device</h1>
    <p class="intro">On the hospital staff dashboard, choose <strong>Add authorized device</strong>, then scan this QR code or enter the code manually.</p>
    <div class="qr-shell" id="qrShell" aria-label="Device authorization QR code">Generating secure code…</div>
    <div class="code-label">Authorization code</div>
    <div class="code" id="enrollmentCode">------</div>
    <p class="expires" id="expiresText">This code expires in 10:00</p>
    <div class="status" id="enrollmentStatus" role="status"><span class="dot"></span><span>Waiting for staff approval…</span></div>
  </main>
  <script>
    const qrShell = document.getElementById('qrShell');
    const enrollmentCode = document.getElementById('enrollmentCode');
    const expiresText = document.getElementById('expiresText');
    const enrollmentStatus = document.getElementById('enrollmentStatus');
    let enrollmentId = '';
    let expiresAt = 0;
    let pollTimer = 0;
    let clockTimer = 0;

    function setStatus(message, type = '') {
      enrollmentStatus.className = `status ${type}`.trim();
      enrollmentStatus.innerHTML = `<span class="dot"></span><span>${message}</span>`;
    }

    function updateCountdown() {
      const remaining = Math.max(0, expiresAt - Date.now());
      const minutes = Math.floor(remaining / 60000);
      const seconds = String(Math.floor((remaining % 60000) / 1000)).padStart(2, '0');
      expiresText.textContent = remaining ? `This code expires in ${minutes}:${seconds}` : 'This code has expired';
      if (!remaining) {
        clearInterval(clockTimer);
        clearTimeout(pollTimer);
        setStatus('Code expired. Refresh this page to generate a new one.', 'error');
      }
    }

    async function pollStatus() {
      try {
        const response = await fetch(`/api/device-enrollments/${enrollmentId}/status`, { cache: 'no-store' });
        const result = await response.json();
        if (result.status === 'authorized') {
          clearInterval(clockTimer);
          setStatus('Device authorized. Opening patient login…', 'ready');
          setTimeout(() => location.replace('/#/roles'), 900);
          return;
        }
        if (result.status === 'expired') {
          expiresAt = 0;
          updateCountdown();
          return;
        }
      } catch (_) {}
      pollTimer = setTimeout(pollStatus, 1800);
    }

    async function beginEnrollment() {
      try {
        const response = await fetch('/api/device-enrollments', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
        if (!response.ok) throw new Error('Enrollment service unavailable');
        const enrollment = await response.json();
        enrollmentId = enrollment.id;
        expiresAt = enrollment.expiresAt;
        enrollmentCode.textContent = enrollment.code;
        qrShell.innerHTML = `<img src="${enrollment.qrDataUrl}" alt="QR code containing the device authorization code" />`;
        updateCountdown();
        clockTimer = setInterval(updateCountdown, 1000);
        pollStatus();
      } catch (_) {
        qrShell.textContent = 'Could not generate a code';
        setStatus('Enrollment service is unavailable. Try again shortly.', 'error');
      }
    }

    beginEnrollment();
  </script>
</body>
</html>
