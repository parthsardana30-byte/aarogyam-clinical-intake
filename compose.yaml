name: aarogyam

services:
  site:
    build: .
    container_name: aarogyam-site
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PATIENT_DATA_KEY: ${PATIENT_DATA_KEY}
      MSG91_WIDGET_ID: ${MSG91_WIDGET_ID}
      MSG91_WIDGET_TOKEN: ${MSG91_WIDGET_TOKEN}
      MSG91_AUTH_KEY: ${MSG91_AUTH_KEY}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_AGENT_ID: ${ELEVENLABS_AGENT_ID:-}
      AAROGYAM_API_URL: ${AAROGYAM_API_URL:-}
      AAROGYAM_API_KEY: ${AAROGYAM_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_ACCESS_TOKEN: ${GEMINI_ACCESS_TOKEN:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      GEMINI_TIMEOUT_MS: ${GEMINI_TIMEOUT_MS:-45000}
      ALLOW_TEST_DEVICE_CODE: ${ALLOW_TEST_DEVICE_CODE:-false}
      TEST_DEVICE_CODE: ${TEST_DEVICE_CODE:-}
      TEST_DEVICE_SESSION_HOURS: ${TEST_DEVICE_SESSION_HOURS:-24}
    volumes:
      - ./data:/app/data
    networks:
      - web

networks:
  web:
    external: true
    name: cashfree-subscription-bot_default
